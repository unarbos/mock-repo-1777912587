name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-sonnet-4-5 --max-turns 15 --allowedTools mcp__github_inline_comment__create_inline_comment,mcp__github__create_issue_comment,mcp__github__update_issue_comment"
          use_sticky_comment: true
          track_progress: true
          prompt: |
            Please review this pull request. Focus on:
            - Correctness and obvious bugs
            - Security issues
            - Readability and maintainability
            - Test coverage gaps

            Leave inline review comments where appropriate and a short summary at the end.
            Do not push commits; review only.
